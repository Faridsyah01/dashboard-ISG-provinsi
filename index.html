<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Interaktif</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      height: 100vh;
      overflow: hidden; /* HILANGKAN SCROLL */
    }

    /* Header */
    .header {
      background: white;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
    }

    .logo {
      height: 40px;
    }

    /* Content */
    .content {
      height: calc(100vh - 70px); /* layar - tinggi header */
      padding: 12px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 10px;
      height: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tableauPlaceholder {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    @media(max-width: 768px) {
      .header h1 {
        font-size: 16px;
      }

      .logo {
        height: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>Dashboard Data Interaktif</h1>
    <img src="brin.png" alt="Logo" class="logo">
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="card">

      <!-- EMBED TABLEAU -->
      <div class='tableauPlaceholder' id='viz1768271353559'>

        <noscript>
          <a href='#'>
            <img alt='Sheet 1'
              src='https://public.tableau.com/static/images/Bo/Book1_17682299665100/Sheet1/1_rss.png'
              style='border: none' />
          </a>
        </noscript>

        <object class='tableauViz' style='display:none;'></object>

      </div>

      <script type='text/javascript'>
        var divElement = document.getElementById('viz1768271353559');
        var vizElement = divElement.getElementsByTagName('object')[0];

        vizElement.style.width = '100%';
        vizElement.style.height = '100%';

        var params = [
          { name: 'host_url', value: 'https%3A%2F%2Fpublic.tableau.com%2F' },
          { name: 'embed_code_version', value: '3' },
          { name: 'path', value: 'views/Book1_17682299665100/Sheet1?:language=en-US&:embed=true' },
          { name: 'toolbar', value: 'yes' },
          { name: 'animate_transition', value: 'yes' },
          { name: 'display_spinner', value: 'yes' },
          { name: 'display_overlay', value: 'yes' },
          { name: 'display_count', value: 'yes' },
          { name: 'language', value: 'en-US' }
        ];

        params.forEach(p => {
          var param = document.createElement("param");
          param.name = p.name;
          param.value = p.value;
          vizElement.appendChild(param);
        });

        var scriptElement = document.createElement('script');
        scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
        vizElement.parentNode.insertBefore(scriptElement, vizElement);
      </script>

    </div>
  </div>

</body>
</html>
